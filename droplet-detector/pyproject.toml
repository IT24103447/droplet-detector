[project]
name = "droplet-detector"
version = "0.1.0"
description = "Computer-vision library for automatic water-leak detection in hydrostatic-pressure testing"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10,<5.0",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
