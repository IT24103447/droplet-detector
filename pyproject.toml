[project]
name = "droplet-detector"
version = "0.1.0"
description = "Computer-vision library for automatic water-leak detection in hydrostatic-pressure testing"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10,<5.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "streamlit>=1.51",
    "altair>=5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ui = [
    "streamlit>=1.51",
    "pillow>=10.0",
]
ml = [
    "ultralytics>=8.3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.20,<2; sys_platform != 'win32' or platform_machine != 'AMD64'",
    "onnxruntime-directml>=1.24,<2; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
